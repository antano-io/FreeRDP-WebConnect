[global]
# Enable debug logging and use uncompressed javascript.
debug = false

# Enable core dumps
enablecore = false

# Set non-SSL listener port. nginx ingress terminates TLS, wsgate serves plain HTTP.
port = 8080

# Set bind address of non-SSL listener.
#bindaddr = 0.0.0.0

# Set syslog logging facility.
logfacility = LOCAL6

# Enable daemon mode (kept off inside the container; the process is PID 1).
daemon = false

# Redirect permanently to https (TLS is terminated by the ingress, so off here).
redirect = false

# Path of daemon's PID file.
pidfile = /var/run/wsgate/wsgate.pid

# Client hostname sent to the RDP server (/client-hostname equivalent).
# If omitted, the wsgate host/pod name is used.
clienthostname = DESKTOP-LKS9W3

# Enable the multilingual (IME) keyboard by default in the web client.
#imedefault = true

[http]
# Set document root of web service. NO Default!
documentroot = /usr/share/wsgate/webroot

[acl]
order = deny,allow
allow = *

[rdpoverride]
nofullwindowdrag = true
notheming = true
